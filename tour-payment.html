<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Options - iPOP Fundraising Tour</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fff;
        }

        .tour-header {
            padding: 20px 40px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tour-logo {
            height: 40px;
            width: auto;
        }

        .skip-tour {
            color: #4169E1;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
        }

        .skip-tour:hover {
            text-decoration: underline;
        }

        .tour-container {
            min-height: calc(100vh - 81px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .tour-content {
            display: flex;
            align-items: center;
            gap: 100px;
            max-width: 1200px;
            width: 100%;
        }

        .phone-mockup {
            flex-shrink: 0;
            width: 380px;
            background: white;
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }

        .phone-screen {
            background: white;
            border-radius: 30px;
            overflow: hidden;
        }

        .phone-notch {
            height: 30px;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .notch {
            width: 120px;
            height: 20px;
            background: #f0f0f0;
            border-radius: 0 0 15px 15px;
        }

        .payment-screen {
            padding: 60px 40px;
            text-align: center;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .payment-card {
            width: 240px;
            height: 140px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-size: 18px;
            font-weight: 600;
            color: #2C2C2C;
            transform: rotate(-3deg);
            position: relative;
        }

        .payment-card:last-child {
            transform: rotate(3deg);
        }

        .payment-card.blue {
            background: linear-gradient(135deg, #E3F2FD 0%, #90CAF9 100%);
            box-shadow: 0 8px 20px rgba(66, 165, 245, 0.3);
        }

        .payment-card.orange {
            background: linear-gradient(135deg, #FFE0B2 0%, #FFB74D 100%);
            box-shadow: 0 8px 20px rgba(255, 152, 0, 0.3);
        }

        .payment-icon {
            font-size: 40px;
        }

        .tour-text {
            flex: 1;
        }

        .tour-text h2 {
            font-size: 42px;
            font-weight: 700;
            color: #2C2C2C;
            line-height: 1.3;
            margin: 0 0 60px 0;
        }

        .tour-navigation {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: none;
            color: #2C2C2C;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            padding: 10px 20px;
            transition: all 0.3s ease;
        }

        .btn-back::before {
            content: '←';
            font-size: 24px;
        }

        .btn-back:hover {
            transform: translateX(-5px);
        }

        .dot-nav {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ddd;
            cursor: pointer;
        }

        .dot.active {
            background: #2C2C2C;
        }

        .btn-get-started {
            margin-left: auto;
            display: inline-block;
            background: #2C2C2C;
            color: white;
            padding: 14px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-get-started:hover {
            background: #1a1a1a;
            transform: translateY(-2px);
        }

        @media (max-width: 1024px) {
            .tour-content {
                flex-direction: column;
                gap: 50px;
            }

            .phone-mockup {
                width: 320px;
            }

            .tour-text h2 {
                font-size: 32px;
                text-align: center;
            }
        }

        @media (max-width: 768px) {
            .tour-header {
                padding: 15px 20px;
            }

            .phone-mockup {
                width: 280px;
            }

            .payment-screen {
                padding: 40px 20px;
            }

            .payment-card {
                width: 200px;
                height: 120px;
                font-size: 16px;
            }

            .payment-icon {
                font-size: 32px;
            }

            .tour-text h2 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <header class="tour-header">
        <a href="index.html">
            <img src="logo.png" alt="iPOP Gourmet Popcorn" class="tour-logo">
        </a>
        <a href="start-fundraiser.html" class="skip-tour">Skip Tour</a>
    </header>

    <div class="tour-container">
        <div class="tour-content">
            <div class="phone-mockup">
                <div class="phone-screen">
                    <div class="phone-notch">
                        <div class="notch"></div>
                    </div>
                    <div class="payment-screen">
                        <div class="payment-card blue">
                            <div class="payment-icon">⚡</div>
                            <div>Direct Deposit</div>
                        </div>
                        <div class="payment-card orange">
                            <div class="payment-icon">💳</div>
                            <div>Check</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tour-text">
                <h2>Receive a check or direct deposit for 50% of all sales</h2>

                <div class="tour-navigation">
                    <button class="btn-back" onclick="window.location.href='tour-shopping.html'">Back</button>
                    <div class="dot-nav">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot active"></div>
                    </div>
                    <a href="start-fundraiser.html" class="btn-get-started">Get Started</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
