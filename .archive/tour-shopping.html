<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping - iPOP Fundraising Tour</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fff;
        }

        .tour-header {
            padding: 20px 40px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tour-logo {
            height: 40px;
            width: auto;
        }

        .skip-tour {
            color: #4169E1;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
        }

        .skip-tour:hover {
            text-decoration: underline;
        }

        .tour-container {
            min-height: calc(100vh - 81px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .tour-content {
            display: flex;
            align-items: center;
            gap: 100px;
            max-width: 1200px;
            width: 100%;
        }

        .phone-mockup {
            flex-shrink: 0;
            width: 380px;
            background: white;
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }

        .phone-screen {
            background: white;
            border-radius: 30px;
            overflow: hidden;
        }

        .phone-notch {
            height: 30px;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .notch {
            width: 120px;
            height: 20px;
            background: #f0f0f0;
            border-radius: 0 0 15px 15px;
        }

        .thank-you-screen {
            padding: 40px 30px;
            text-align: center;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .product-cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .product-card {
            width: 140px;
            height: 140px;
            border-radius: 15px;
            position: relative;
            transform: rotate(-5deg);
        }

        .product-card:last-child {
            transform: rotate(5deg);
        }

        .product-card.green {
            background: linear-gradient(135deg, #90EE90 0%, #32CD32 100%);
            box-shadow: 0 8px 20px rgba(50, 205, 50, 0.3);
        }

        .product-card.yellow {
            background: linear-gradient(135deg, #FFFACD 0%, #FFD700 100%);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
        }

        .checkmark {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 30px;
            height: 30px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #32CD32;
            font-size: 18px;
            font-weight: bold;
        }

        .product-card.yellow .checkmark {
            color: #FFA500;
        }

        .product-emoji {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 50px;
        }

        .thank-you-text {
            font-size: 24px;
            font-weight: 700;
            color: #2C2C2C;
            margin-bottom: 30px;
        }

        .supporter-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #87CEEB 0%, #4682B4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto;
            position: relative;
        }

        .sparkles {
            position: absolute;
            width: 120%;
            height: 120%;
            top: -10%;
            left: -10%;
        }

        .sparkle {
            position: absolute;
            font-size: 24px;
        }

        .sparkle:nth-child(1) { top: 0; left: 10px; }
        .sparkle:nth-child(2) { top: 0; right: 10px; }
        .sparkle:nth-child(3) { bottom: 0; left: 10px; }
        .sparkle:nth-child(4) { bottom: 0; right: 10px; }

        .tour-text {
            flex: 1;
        }

        .tour-text h2 {
            font-size: 42px;
            font-weight: 700;
            color: #2C2C2C;
            line-height: 1.3;
            margin: 0 0 60px 0;
        }

        .tour-navigation {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: none;
            color: #2C2C2C;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            padding: 10px 20px;
            transition: all 0.3s ease;
        }

        .btn-back::before {
            content: '←';
            font-size: 24px;
        }

        .btn-back:hover {
            transform: translateX(-5px);
        }

        .dot-nav {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ddd;
            cursor: pointer;
        }

        .dot.active {
            background: #2C2C2C;
        }

        .btn-next {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: none;
            color: #2C2C2C;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            padding: 10px 20px;
            transition: all 0.3s ease;
        }

        .btn-next:hover {
            transform: translateX(5px);
        }

        .btn-next::after {
            content: '→';
            font-size: 24px;
        }

        @media (max-width: 1024px) {
            .tour-content {
                flex-direction: column;
                gap: 50px;
            }

            .phone-mockup {
                width: 320px;
            }

            .tour-text h2 {
                font-size: 32px;
                text-align: center;
            }
        }

        @media (max-width: 768px) {
            .tour-header {
                padding: 15px 20px;
            }

            .phone-mockup {
                width: 280px;
            }

            .product-card {
                width: 110px;
                height: 110px;
            }

            .product-emoji {
                font-size: 40px;
            }

            .tour-text h2 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <header class="tour-header">
        <a href="index.html">
            <img src="logo.png" alt="iPOP Gourmet Popcorn" class="tour-logo">
        </a>
        <a href="start-fundraiser.html" class="skip-tour">Skip Tour</a>
    </header>

    <div class="tour-container">
        <div class="tour-content">
            <div class="phone-mockup">
                <div class="phone-screen">
                    <div class="phone-notch">
                        <div class="notch"></div>
                    </div>
                    <div class="thank-you-screen">
                        <div class="product-cards">
                            <div class="product-card green">
                                <div class="checkmark">✓</div>
                                <div class="product-emoji">🍿</div>
                            </div>
                            <div class="product-card yellow">
                                <div class="checkmark">✓</div>
                                <div class="product-emoji">🌽</div>
                            </div>
                        </div>
                        <div class="thank-you-text">Thanks for your support!</div>
                        <div class="supporter-avatar">
                            <div class="sparkles">
                                <div class="sparkle">✨</div>
                                <div class="sparkle">✨</div>
                                <div class="sparkle">✨</div>
                                <div class="sparkle">✨</div>
                            </div>
                            🤸‍♀️
                        </div>
                    </div>
                </div>
            </div>

            <div class="tour-text">
                <h2>Supporters shop online and receive popcorn directly</h2>

                <div class="tour-navigation">
                    <button class="btn-back" onclick="window.location.href='tour-store.html'">Back</button>
                    <div class="dot-nav">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot active"></div>
                        <div class="dot"></div>
                    </div>
                    <button class="btn-next" onclick="window.location.href='tour-payment.html'">Next</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
