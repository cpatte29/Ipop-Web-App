<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-Day Campaign - iPOP Fundraising Tour</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fff;
        }

        .tour-header {
            padding: 20px 40px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tour-logo {
            height: 40px;
            width: auto;
        }

        .skip-tour {
            color: #4169E1;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
        }

        .skip-tour:hover {
            text-decoration: underline;
        }

        .tour-container {
            min-height: calc(100vh - 81px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .tour-content {
            display: flex;
            align-items: center;
            gap: 100px;
            max-width: 1200px;
            width: 100%;
        }

        .phone-mockup {
            flex-shrink: 0;
            width: 380px;
            background: #F5F5F5;
            border-radius: 40px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }

        .growth-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .growth-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 280px;
            gap: 15px;
            position: relative;
        }

        .bar-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        .bar {
            width: 100%;
            background: linear-gradient(to top, #32CD32, #90EE90);
            border-radius: 12px 12px 0 0;
            position: relative;
            box-shadow: 0 4px 12px rgba(50, 205, 50, 0.3);
            animation: growUp 1s ease-out forwards;
            transform-origin: bottom;
        }

        .bar-label {
            font-size: 18px;
            font-weight: 700;
            color: #2C2C2C;
            padding: 8px;
        }

        .bar-value {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            font-weight: 700;
            color: #32CD32;
            animation: fadeIn 0.5s ease-out 1s forwards;
            opacity: 0;
        }

        @keyframes growUp {
            from {
                height: 0;
                opacity: 0;
            }
            to {
                height: var(--bar-height);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .bar-container:nth-child(1) .bar {
            --bar-height: 60px;
            animation-delay: 0.2s;
        }

        .bar-container:nth-child(2) .bar {
            --bar-height: 110px;
            animation-delay: 0.5s;
        }

        .bar-container:nth-child(3) .bar {
            --bar-height: 180px;
            animation-delay: 0.8s;
        }

        .bar-container:nth-child(4) .bar {
            --bar-height: 260px;
            animation-delay: 1.1s;
            background: linear-gradient(to top, #E63946, #FF6B6B);
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
        }

        .bar-container:nth-child(1) .bar-value {
            animation-delay: 1.2s;
        }

        .bar-container:nth-child(2) .bar-value {
            animation-delay: 1.5s;
        }

        .bar-container:nth-child(3) .bar-value {
            animation-delay: 1.8s;
        }

        .bar-container:nth-child(4) .bar-value {
            animation-delay: 2.1s;
            color: #E63946;
        }

        .growth-arrow {
            position: absolute;
            bottom: 20px;
            left: 10%;
            right: 10%;
            height: 3px;
            background: linear-gradient(to right, #32CD32, #E63946);
            border-radius: 2px;
        }

        .growth-arrow::after {
            content: '';
            position: absolute;
            right: -10px;
            top: -6px;
            width: 0;
            height: 0;
            border-left: 15px solid #E63946;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
        }

        .tour-text {
            flex: 1;
        }

        .tour-text h2 {
            font-size: 42px;
            font-weight: 700;
            color: #2C2C2C;
            line-height: 1.3;
            margin: 0 0 60px 0;
        }

        .tour-navigation {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .dot-nav {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ddd;
            cursor: pointer;
        }

        .dot.active {
            background: #2C2C2C;
        }

        .btn-next {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: none;
            color: #2C2C2C;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            padding: 10px 20px;
            transition: all 0.3s ease;
        }

        .btn-next:hover {
            transform: translateX(5px);
        }

        .btn-next::after {
            content: '→';
            font-size: 24px;
        }

        @media (max-width: 1024px) {
            .tour-content {
                flex-direction: column;
                gap: 50px;
            }

            .phone-mockup {
                width: 320px;
                padding: 40px 30px;
            }

            .tour-text h2 {
                font-size: 32px;
                text-align: center;
            }
        }

        @media (max-width: 768px) {
            .tour-header {
                padding: 15px 20px;
            }

            .phone-mockup {
                width: 280px;
                padding: 30px 20px;
            }

            .growth-card {
                padding: 20px;
            }

            .growth-chart {
                height: 200px;
            }

            .bar-label {
                font-size: 14px;
            }

            .bar-value {
                font-size: 16px;
                top: -28px;
            }

            .tour-text h2 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <header class="tour-header">
        <a href="index.html">
            <img src="logo.png" alt="iPOP Gourmet Popcorn" class="tour-logo">
        </a>
        <a href="start-fundraiser.html" class="skip-tour">Skip Tour</a>
    </header>

    <div class="tour-container">
        <div class="tour-content">
            <div class="phone-mockup">
                <div class="growth-card">
                    <div class="growth-chart">
                        <div class="growth-arrow"></div>
                        <div class="bar-container">
                            <div class="bar">
                                <div class="bar-value">$500</div>
                            </div>
                            <div class="bar-label">Day 1</div>
                        </div>
                        <div class="bar-container">
                            <div class="bar">
                                <div class="bar-value">$1,200</div>
                            </div>
                            <div class="bar-label">Day 2</div>
                        </div>
                        <div class="bar-container">
                            <div class="bar">
                                <div class="bar-value">$2,800</div>
                            </div>
                            <div class="bar-label">Day 3</div>
                        </div>
                        <div class="bar-container">
                            <div class="bar">
                                <div class="bar-value">$5,000</div>
                            </div>
                            <div class="bar-label">Day 4</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tour-text">
                <h2>All events last 4 days to build urgency and reduce fatigue</h2>

                <div class="tour-navigation">
                    <div class="dot-nav">
                        <div class="dot active"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <button class="btn-next" onclick="window.location.href='tour-store.html'">Next</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
