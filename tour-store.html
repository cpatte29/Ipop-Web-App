<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Store - iPOP Fundraising Tour</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #E8F4F8;
        }

        .tour-header {
            padding: 20px 40px;
            background: white;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tour-logo {
            height: 40px;
            width: auto;
        }

        .skip-tour {
            color: #4169E1;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
        }

        .skip-tour:hover {
            text-decoration: underline;
        }

        .tour-container {
            min-height: calc(100vh - 81px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .tour-content {
            display: flex;
            align-items: center;
            gap: 100px;
            max-width: 1200px;
            width: 100%;
        }

        .phone-mockup {
            flex-shrink: 0;
            width: 380px;
            background: white;
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }

        .phone-screen {
            background: white;
            border-radius: 30px;
            overflow: hidden;
        }

        .phone-notch {
            height: 30px;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .notch {
            width: 120px;
            height: 20px;
            background: #f0f0f0;
            border-radius: 0 0 15px 15px;
        }

        .store-image {
            width: 100%;
            height: 280px;
            background: linear-gradient(135deg, #87CEEB 0%, #4682B4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .gymnast-placeholder {
            width: 200px;
            height: 200px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }

        .store-details {
            padding: 30px;
            text-align: center;
        }

        .store-details h3 {
            font-size: 24px;
            font-weight: 700;
            color: #2C2C2C;
            margin: 0 0 10px 0;
        }

        .store-details p {
            font-size: 15px;
            color: #666;
            line-height: 1.5;
            margin: 0 0 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #E0E0E0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            width: 100%;
            height: 100%;
            background: #32CD32;
            border-radius: 10px;
        }

        .goal-text {
            font-size: 18px;
            font-weight: 700;
            color: #2C2C2C;
        }

        .tour-text {
            flex: 1;
        }

        .tour-text h2 {
            font-size: 42px;
            font-weight: 700;
            color: #2C2C2C;
            line-height: 1.3;
            margin: 0 0 60px 0;
        }

        .tour-navigation {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: none;
            color: #2C2C2C;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            padding: 10px 20px;
            transition: all 0.3s ease;
        }

        .btn-back::before {
            content: '←';
            font-size: 24px;
        }

        .btn-back:hover {
            transform: translateX(-5px);
        }

        .dot-nav {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ddd;
            cursor: pointer;
        }

        .dot.active {
            background: #2C2C2C;
        }

        .btn-next {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: none;
            color: #2C2C2C;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            padding: 10px 20px;
            transition: all 0.3s ease;
        }

        .btn-next:hover {
            transform: translateX(5px);
        }

        .btn-next::after {
            content: '→';
            font-size: 24px;
        }

        @media (max-width: 1024px) {
            .tour-content {
                flex-direction: column;
                gap: 50px;
            }

            .phone-mockup {
                width: 320px;
            }

            .tour-text h2 {
                font-size: 32px;
                text-align: center;
            }
        }

        @media (max-width: 768px) {
            .tour-header {
                padding: 15px 20px;
            }

            .phone-mockup {
                width: 280px;
            }

            .tour-text h2 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <header class="tour-header">
        <a href="index.html">
            <img src="logo.png" alt="iPOP Gourmet Popcorn" class="tour-logo">
        </a>
        <a href="start-fundraiser.html" class="skip-tour">Skip Tour</a>
    </header>

    <div class="tour-container">
        <div class="tour-content">
            <div class="phone-mockup">
                <div class="phone-screen">
                    <div class="phone-notch">
                        <div class="notch"></div>
                    </div>
                    <div class="store-image">
                        <div class="gymnast-placeholder">🤸‍♀️</div>
                    </div>
                    <div class="store-details">
                        <h3>Anastasia's Pop-Up Store</h3>
                        <p>I am raising funds for my gymnastics team to go to Nationals!</p>
                        <div class="progress-bar">
                            <div class="progress-fill"></div>
                        </div>
                        <div class="goal-text">$2,000 of $2,000</div>
                    </div>
                </div>
            </div>

            <div class="tour-text">
                <h2>Each Seller creates their own, personalized Pop-Up Store</h2>

                <div class="tour-navigation">
                    <button class="btn-back" onclick="window.location.href='tour-day4.html'">Back</button>
                    <div class="dot-nav">
                        <div class="dot"></div>
                        <div class="dot active"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <button class="btn-next" onclick="window.location.href='tour-shopping.html'">Next</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
